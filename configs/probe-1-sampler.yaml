# probe-1-sampler — Phase 4.8/4.4: sampler-fix-only probe (faithful to minigpt-high,
# only max-steps/eval/ckpt shortened). Directly tests whether the token-weighted
# sampler + per-worker reseed changes the loss trajectory vs the original run's
# first ~5k steps. eval_max_batches=50 matches the original run's eval protocol
# for apples-to-apples comparison; a separate full-val eval is run at the end.
name: probe-1-sampler

model:
  vocab_size: 32000
  num_layers: 8
  hidden_size: 384
  num_heads: 6
  max_position_embeddings: 1024
  dropout: 0.1
  rope_theta: 10000.0
  tie_weights: true

training:
  seed: 42
  context_length: 1024
  per_device_batch: 4
  grad_accum: 16
  max_steps: 5000
  lr: 5.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  min_lr_ratio: 0.1
  eval_every: 500
  ckpt_every: 500
  log_every: 10
  grad_clip: 1.0
  num_workers: 2
  train_shards:
    - tinystories.bin
    - wikitext.bin
    - fineweb.bin
  val_shard: val.bin
  eval_max_batches: 50