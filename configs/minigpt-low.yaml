# minigpt-low — smaller sanity model (~13M params)
# Train: TinyStories only, ~50k steps, target val PPL ≤ 25
#
# Hparams updated 2026-08-16 (Phase 4.8): promoted probe-2-hparam settings
# (dropout 0.0, lr 1e-3, wd 0.05) for consistency with minigpt-high. warmup
# scaled to 5000 (10% of 50k) for the higher 2x LR.
name: minigpt-low

model:
  vocab_size: 32000
  num_layers: 6
  hidden_size: 256
  num_heads: 4
  max_position_embeddings: 512
  dropout: 0.0
  rope_theta: 10000.0
  tie_weights: true

training:
  seed: 42
  context_length: 512
  per_device_batch: 4
  grad_accum: 16
  max_steps: 50000
  lr: 1.0e-3
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 5000
  min_lr_ratio: 0.1
  eval_every: 1000
  ckpt_every: 1000
  log_every: 10
  grad_clip: 1.0
  num_workers: 2
  train_shards:
    - tinystories.bin
  val_shard: val.bin
