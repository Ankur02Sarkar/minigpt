# minigpt-high — larger FINAL model (~26M params)
# Train: TinyStories + WikiText + FineWeb (500M), ~100k steps, target val PPL ≤ 18
name: minigpt-high

model:
  vocab_size: 32000
  num_layers: 8
  hidden_size: 384
  num_heads: 6
  max_position_embeddings: 1024
  dropout: 0.1
  rope_theta: 10000.0
  tie_weights: true

training:
  seed: 42
  context_length: 1024
  per_device_batch: 4
  grad_accum: 16
  max_steps: 100000
  lr: 5.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  min_lr_ratio: 0.1
  eval_every: 2000
  ckpt_every: 2000
  log_every: 10
  grad_clip: 1.0
  num_workers: 2
  train_shards:
    - tinystories.bin
    - wikitext.bin
    - fineweb.bin
  val_shard: val.bin
