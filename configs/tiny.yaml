# ~13M param sanity model (Phase 4.2 / smoke)
model:
  vocab_size: 32000
  num_layers: 6
  hidden_size: 256
  num_heads: 4
  max_position_embeddings: 512
  dropout: 0.1
  rope_theta: 10000.0
  tie_weights: true

training:
  seed: 42
  context_length: 512
  per_device_batch: 4
  grad_accum: 16
  max_steps: 50000
  lr: 5.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  min_lr_ratio: 0.1
  eval_every: 1000
  ckpt_every: 1000
  log_every: 10
  grad_clip: 1.0
  num_workers: 2
  train_shards:
    - tinystories.bin
  val_shard: val.bin
