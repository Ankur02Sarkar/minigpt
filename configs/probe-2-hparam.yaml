# probe-2-hparam — Phase 4.8/4.4: sampler fix + relaxed optimization.
# Tests whether dropout 0.1 + wd 0.1 over ~6 epochs was suppressing learning and
# whether a higher peak LR trains the 26M model faster. dropout 0.0, lr 1e-3,
# wd 0.05, warmup 500 (shorter so LR peaks early in the 5k-step probe).
name: probe-2-hparam

model:
  vocab_size: 32000
  num_layers: 8
  hidden_size: 384
  num_heads: 6
  max_position_embeddings: 1024
  dropout: 0.0
  rope_theta: 10000.0
  tie_weights: true

training:
  seed: 42
  context_length: 1024
  per_device_batch: 4
  grad_accum: 16
  max_steps: 5000
  lr: 1.0e-3
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 500
  min_lr_ratio: 0.1
  eval_every: 500
  ckpt_every: 500
  log_every: 10
  grad_clip: 1.0
  num_workers: 2
  train_shards:
    - tinystories.bin
    - wikitext.bin
    - fineweb.bin
  val_shard: val.bin
  eval_max_batches: 50