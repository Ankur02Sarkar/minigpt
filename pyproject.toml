[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigpt-llm"
version = "0.1.0"
description = "A from-scratch GPT trained on Azure with a T4 GPU — OpenAI + Ollama compatible serving."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ankur Sarkar" }]
dependencies = [
    "torch>=2.2.0",
    "numpy>=2.2.0",
    "datasets>=4.0.0",
    "tokenizers>=0.21.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "structlog>=25.1.0",
    "tensorboard>=2.18.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langdetect>=1.0.9",
    "regex>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["minigpt_llm", "training", "serving", "inference", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TCH omitted: Path/Callable used widely in signatures under postponed annotations;
# TYPE_CHECKING blocks add noise without much value in this codebase.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "datasets.*",
    "tokenizers.*",
    "tensorboard.*",
    "langdetect.*",
    "regex.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short"
