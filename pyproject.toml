[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigpt-llm"
version = "0.1.0"
description = "A from-scratch GPT trained on Azure with a T4 GPU — OpenAI + Ollama compatible serving."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ankur Sarkar" }]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    "pyyaml>=6.0",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "tensorboard>=2.16.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["minigpt_llm", "training", "serving", "inference"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["torch.*", "datasets.*", "tokenizers.*", "tensorboard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short"
